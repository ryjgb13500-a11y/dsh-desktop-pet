<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 桌宠 · 可视化编辑器</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">🐋 DSH 桌宠编辑器</span>
    <nav class="tabs" id="poseTabs">
      <button data-pose="sleep">😴 睡眠</button>
      <button data-pose="surprised">😲 惊醒</button>
      <button data-pose="writing">✍️ 写字</button>
    </nav>
    <span class="zoom-group">
      画布缩放
      <button id="zoomOut">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn">+</button>
      <button id="zoomFit">适应</button>
    </span>
    <button id="btnUndo" title="撤销 (Ctrl+Z)">↩ 撤销</button>
    <button id="btnRedo" title="重做 (Ctrl+Y)">↪ 重做</button>
    <button id="btnSave" class="primary">💾 保存并应用到宠物</button>
    <span id="status"></span>
  </header>

  <main class="layout">
    <!-- 左侧：素材库 -->
    <aside class="library" id="library">
      <h2>素材库 <span class="hint">（点击添加 / 拖入画布）</span></h2>
      <div class="groups" id="groups"></div>
    </aside>

    <!-- 中央：画布 -->
    <section class="canvas-zone">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="stage" width="560" height="600"></canvas>
      </div>
      <div class="canvas-tip">点选部件拖动摆放 · 滚轮缩放选中部件 · Delete 删除 · 橙色圆点=骨骼关节（可拖）</div>
    </section>

    <!-- 右侧：图层面板 + 属性面板 -->
    <aside class="props" id="props">
      <h2>图层 <span class="hint">（点击选中 · 拖动排序 · 眼睛=显隐）</span></h2>
      <div class="layers" id="layers"></div>
      <div class="prop-sep"></div>
      <h2>属性面板</h2>
      <div id="propBody">
        <p class="dim">先在画布或图层面板中点选一个部件</p>
      </div>
      <div class="prop-sep"></div>
      <h2>画布</h2>
      <label class="chk"><input type="checkbox" id="chkGrid" checked> 显示参考线</label>
      <div class="prop-sep"></div>
      <h2>🎬 动作绑定</h2>
      <div id="animPanel" style="font-size:12px">
        <div class="anim-sec">
          <b>呼吸（睡眠态）</b><br>
          <span class="dim">勾选参与呼吸的元素：</span>
          <div id="animBreathTargets" class="anim-checks"></div>
          幅度(px): <input type="number" id="animBreathAmp" step="0.2" style="width:50px"> 
          周期(ms): <input type="number" id="animBreathCycle" step="100" style="width:60px">
        </div>
        <div class="anim-sec" style="margin-top:8px">
          <b>唤醒序列(ms)</b><br>
          泡泡破裂: <input type="number" id="animWakePop" step="50" style="width:50px">
          惊讶: <input type="number" id="animWakeSurprise" step="50" style="width:50px"><br>
          叹号淡出: <input type="number" id="animWakeFade" step="50" style="width:50px">
        </div>
        <div class="anim-sec" style="margin-top:8px">
          <b>写字动作（左右平移）</b><br>
          <span class="dim">勾选同步移动的元素：</span>
          <div id="animWriteTargets" class="anim-checks"></div>
          幅度(px): <input type="number" id="animWriteAmp" step="0.5" style="width:50px">
          速度(ms): <input type="number" id="animWriteSpeed" step="20" style="width:60px">
        </div>
        <div style="margin-top:8px">
          <button id="btnSaveAnim" style="background:#3a6;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer">💾 保存动作绑定</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="editor.js"></script>
</body>
</html>
